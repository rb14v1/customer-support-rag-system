<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Documents & Magnifying Glass -->
  <g id="documents-search">
    <!-- Back Document -->
    <rect x="56" y="16" width="22" height="28" rx="4" fill="#8EA3C6" opacity="0.8"/>
    <!-- Front Document -->
    <rect x="48" y="22" width="22" height="28" rx="4" fill="#203A60"/>
    <line x1="53" y1="28" x2="65" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="53" y1="34" x2="63" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Magnifying Glass -->
    <circle cx="65" cy="41" r="7.5" fill="#FFFFFF" stroke="#203A60" stroke-width="3"/>
    <line x1="71" y1="46.5" x2="79" y2="54.5" stroke="#203A60" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Headset & Chat Bubble -->
  <g id="headset-chat">
    <!-- Headset Top Arc -->
    <path d="M 20 54 A 23 23 0 0 1 64 54" fill="none" stroke="#203A60" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Earpad -->
    <rect x="15" y="45" width="10" height="19" rx="5" fill="#203A60"/>
    <!-- Right Earpad -->
    <rect x="59" y="45" width="10" height="19" rx="5" fill="#203A60"/>
    <!-- Speech Bubble -->
    <path d="M 42 34 C 53.0457 34 62 42.0589 62 52 C 62 61.9411 53.0457 70 42 70 C 39.2 70 36.5 69.5 34 68.6 L 24 75 L 26.5 64.8 C 23.7 61.8 22 57.1 22 52 C 22 42.0589 30.9543 34 42 34 Z" fill="#FFFFFF" stroke="#203A60" stroke-width="5" stroke-linejoin="round"/>
    <!-- Three Dots in Chat Bubble -->
    <circle cx="33" cy="52" r="3" fill="#203A60"/>
    <circle cx="42" cy="52" r="3" fill="#203A60"/>
    <circle cx="51" cy="52" r="3" fill="#203A60"/>
    <!-- Microphone Arm & Tip -->
    <path d="M 64 60 C 64 74, 49 76, 44 74" fill="none" stroke="#203A60" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="74" r="5" fill="#203A60"/>
  </g>
</svg>