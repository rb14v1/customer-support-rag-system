name: Harbour Build
on:
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ['api', 'web']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          if [ -f "./${{ matrix.component }}/Dockerfile" ]; then
            echo "path=./${{ matrix.component }}/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./${{ matrix.component }}" >> $GITHUB_OUTPUT
          elif [ -f "./Dockerfile.${{ matrix.component }}" ]; then
            echo "path=./Dockerfile.${{ matrix.component }}" >> $GITHUB_OUTPUT
            echo "context=." >> $GITHUB_OUTPUT
          else
            echo "ERROR: No Dockerfile found for ${{ matrix.component }}" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          dockerfile: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.component }}-latest
            ghcr.io/${{ github.repository }}:${{ matrix.component }}-${{ github.sha }}
