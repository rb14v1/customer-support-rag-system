# ---------------------------------------------------------------
# Docker Build & Push
#
# • On every pull-request targeting main: build the image to
#   validate the Dockerfile (no push).
# • On every push to main: build, tag, and push to the GitHub
#   Container Registry (ghcr.io).
# ---------------------------------------------------------------
name: Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Docker tooling
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # 3. Registry authentication (push only on main branch)
      # --------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # 4. Derive image tags & OCI labels
      # --------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # --------------------------------------------------------
      # 5. Build (and push when on main)
      # --------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
